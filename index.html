<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魏晋南北朝重要人物活跃时期对比</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    background: rgba(16,16,28,0.45); color: #e0e0e0; min-height: 100vh;

  body::before {
    content: '';

    background: url("luoshen-bg.jpg") no-repeat center bottom / cover;
    opacity: 0.28;

  }
  .container {
    position: relative; z-index: 1;
  }
  .container { max-width: 100%; padding: 20px; position: relative; z-index: 1; }
  h1 {

  .legend {

  }
  .legend-item { display: flex; align-items: center; gap: 5px; cursor: pointer; transition: opacity 0.2s; }
  .legend-item:hover { opacity: 0.7; }
  .legend-dot { width: 12px; height: 12px; border-radius: 2px; }

  .chart-wrapper {
    position: relative; overflow: auto; border: 1px solid #333;
    border-radius: 8px; background: rgba(18,18,31,0.55);
    max-height: 72vh; max-width: 100%;
  }
  .chart-wrapper::-webkit-scrollbar { width: 8px; height: 8px; }
  .chart-wrapper::-webkit-scrollbar-track { background: #1a1a2e; border-radius: 4px; }
  .chart-wrapper::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
  .chart-wrapper::-webkit-scrollbar-corner { background: #1a1a2e; }

  svg { display: block; }

  .bar-rect { transition: filter 0.15s, opacity 0.15s; cursor: pointer; }
  .bar-rect:hover { filter: brightness(1.5); }
  .bar-rect.selected { filter: brightness(1.8) drop-shadow(0 0 6px currentColor); }

  .tooltip {
    position: fixed; pointer-events: none; opacity: 0;
    background: rgba(20,20,40,0.88); border: 1px solid #555;
    border-radius: 6px; padding: 10px 14px; font-size: 13px;
    line-height: 1.7; z-index: 100; white-space: nowrap;
    transition: opacity 0.12s; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  .tooltip.show { opacity: 1; }
  .tooltip .tname { font-size: 16px; font-weight: 700; color: #fff; }
  .tooltip .tyears { color: #aaa; font-size: 12px; margin-left: 6px; }
  .tooltip .tdetail { color: #ccc; font-size: 12px; }

  .event-line { pointer-events: none; }
  .event-label { font-size: 10px; fill: #666; pointer-events: none; }
  .era-band { opacity: 0.06; pointer-events: none; }
  .era-label-text { font-size: 11px; fill: #555; font-weight: 600; pointer-events: none; }

  /* ── MODAL OVERLAY ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    z-index: 200; display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }

  .modal-card {
    background: linear-gradient(135deg, #1a1a30 0%, #12121f 100%);
    border: 1px solid #444; border-radius: 16px;
    width: 680px; max-width: 95vw; max-height: 88vh;
    overflow-y: auto; overflow-x: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    position: relative; padding: 0;
  }
  .modal-card::-webkit-scrollbar { width: 6px; }
  .modal-card::-webkit-scrollbar-track { background: transparent; }
  .modal-card::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

  .modal-close {
    position: sticky; top: 12px; float: right; z-index: 10;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid #555; background: rgba(0,0,0,0.6);
    color: #ccc; font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    margin-right: 12px; transition: all 0.2s;
  }
  .modal-close:hover { background: #c0392b; border-color: #c0392b; color: #fff; }

  .modal-header {
    display: flex; gap: 20px; padding: 24px 24px 16px;

  }
  .portrait-frame {
    flex-shrink: 0; width: 120px; height: 160px;

    border: 2px solid #444;

  }
  .portrait-frame svg { width: 100%; height: 100%; display: block; }

  .modal-title-area { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .modal-name { font-size: 26px; font-weight: 700; letter-spacing: 2px; }

  }
  .modal-bio {
    padding: 6px 24px; font-size: 14px; line-height: 1.8;

  .modal-events {
    padding: 16px 24px 24px;
  }
  .modal-events h3 {
    font-size: 15px; color: #ddd; margin-bottom: 12px;
    padding-left: 10px; border-left: 3px solid currentColor;
  }
  .event-timeline { position: relative; padding-left: 20px; }
  .event-timeline::before {
    content: ''; position: absolute; left: 6px; top: 4px; bottom: 4px;
    width: 2px; background: #333; border-radius: 1px;
  }
  .event-item {
    position: relative; margin-bottom: 10px; font-size: 13px;

  }
  .event-item::before {
    content: ''; position: absolute; left: -16px; top: 7px;
    width: 8px; height: 8px; border-radius: 50%;
    border: 2px solid #888; background: #1a1a30;
  }
  .event-year { color: #f9a825; font-weight: 600; margin-right: 6px; font-size: 12px; }
  .event-text { color: #bbb; }

  /* hint bar at bottom */
  .hint-bar {
    text-align: center; padding: 8px; font-size: 12px; color: #666;
    margin-top: -8px;
  }
  .hint-bar span { color: #f9a825; }

  /* ── MINI MAP ── */
  .mini-map-panel {
    position: fixed; top: 16px; right: 16px;
    width: 300px; background: rgba(18,18,31,0.72);
    border: 1px solid #333; border-radius: 10px;

    backdrop-filter: blur(6px);
  }
  .mini-map-title {
    font-size: 12px; font-weight: 600; color: #888;
    text-align: center; margin-bottom: 4px;
  }
  .mini-map-panel svg { width: 100%; height: auto; display: block; }
  .map-region {
    cursor: pointer; transition: all 0.3s;
  }
  .map-region:hover { filter: brightness(1.5); }
  .map-label { font-size: 10px; fill: #777; pointer-events: none; text-anchor: middle; }
  .map-label.highlight { fill: #fff; font-weight: 600; }
  .mini-map-fig {
    font-size: 11px; color: #666; text-align: center; margin-top: 4px;
    transition: color 0.3s;
  }
  .mini-map-fig.active { color: #f9a825; }

  @media (max-width: 700px) {
    .modal-header { flex-direction: column; align-items: center; text-align: center; }
    .modal-era-badge { align-self: center; }
  }

  /* ── SEARCH & FILTER ── */
  .search-bar { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 12px; }
  .search-bar input {
    width: 100%; max-width: 360px; padding: 8px 14px;
    border-radius: 20px; border: 1px solid #444; outline: none;
    background: rgba(18,18,31,0.55); color: #ddd; font-size: 14px;
    transition: border-color 0.2s;
  }
  .search-bar input:focus { border-color: #f9a825; }
  .search-bar input::placeholder { color: #666; }
  .filter-tags { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
  .filter-tag {
    padding: 3px 10px; border-radius: 12px; font-size: 12px; cursor: pointer;
    border: 1px solid transparent; transition: all 0.2s; user-select: none;
  }
  .filter-tag:hover { filter: brightness(1.3); }
  .filter-tag.inactive { opacity: 0.3; filter: grayscale(0.7); }

  /* ── COMPARE MODAL ── */
  .compare-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.78);
    z-index: 210; display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .compare-overlay.active { opacity: 1; pointer-events: auto; }
  .compare-card {
    background: linear-gradient(135deg, #1a1a30 0%, #12121f 100%);
    border: 1px solid #444; border-radius: 16px;
    width: 900px; max-width: 96vw; max-height: 88vh;
    overflow-y: auto; overflow-x: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    position: relative; padding: 20px 24px;
  }
  .compare-card::-webkit-scrollbar { width: 6px; }
  .compare-card::-webkit-scrollbar-track { background: transparent; }
  .compare-card::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  .compare-close {
    position: sticky; top: 0; float: right; z-index: 10;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid #555; background: rgba(0,0,0,0.6);
    color: #ccc; font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .compare-close:hover { background: #c0392b; border-color: #c0392b; color: #fff; }
  .compare-cols { display: flex; gap: 20px; }
  .compare-col { flex: 1; min-width: 0; }
  .compare-divider { width: 1px; background: #333; flex-shrink: 0; }
  .compare-col-header { text-align: center; margin-bottom: 12px; }
  .compare-col-header .cname { font-size: 22px; font-weight: 700; letter-spacing: 2px; }
  .compare-col-header .cyears { font-size: 13px; color: #999; }
  .compare-col-header .crole { font-size: 13px; color: #ccc; }
  .compare-portrait { width: 120px; height: 160px; margin: 0 auto 10px; border-radius: 8px; overflow: hidden; border: 2px solid #444; }
  .compare-portrait img { width: 100%; height: 100%; display: block; }
  .compare-bio { font-size: 13px; line-height: 1.7; color: #bbb; margin-bottom: 12px; text-indent: 2em; }
  .compare-events { }
  .compare-events h4 { font-size: 13px; color: #ddd; margin-bottom: 8px; padding-left: 8px; border-left: 3px solid currentColor; }
  .compare-event-item { font-size: 12px; margin-bottom: 6px; padding-left: 12px; position: relative; line-height: 1.5; }
  .compare-event-item::before { content: ''; position: absolute; left: 0; top: 6px; width: 6px; height: 6px; border-radius: 50%; border: 1px solid #666; }
  .compare-event-year { color: #f9a825; font-weight: 600; margin-right: 4px; font-size: 11px; }
  .compare-event-text { color: #aaa; }
  .overlap-badge {
    display: inline-block; padding: 2px 10px; border-radius: 10px;
    font-size: 11px; background: rgba(249,168,37,0.2); color: #f9a825;
    margin-top: 6px;
  }
  .compare-hint {
    text-align: center; margin-top: 14px; font-size: 12px; color: #555;
  }
  .compare-hint span { color: #f9a825; }

  @media (max-width: 700px) {
    .compare-cols { flex-direction: column; }
    .compare-divider { width: 100%; height: 1px; }
  }
</style>

<body>
<div class="container">
  <h1>魏晋南北朝重要人物活跃时期对比</h1>
  <p class="subtitle">公元 150 年 — 620 年 · 涵盖三国至隋初 100 位历史人物 · 悬停看简介 · 点击看生平</p>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="🔍 搜索人物姓名..." autocomplete="off" />
    <div class="filter-tags" id="filterTags"></div>
  </div>
  <div class="legend" id="legend"></div>
  <div class="chart-wrapper" id="chartWrapper">
    <div class="chart-inner"><svg id="chart"></svg></div>
  </div>
  <div class="hint-bar">💡 <span>点击</span>色条查看古风漫画画像 · <span>再点第二人</span>进入对比模式 · <span>Ctrl+图例</span>筛选阵营 · 搜索框过滤姓名</div>
  <div class="mini-map-panel" id="miniMapPanel">
    <div class="mini-map-title">势力区域</div>
    <svg id="miniMap" viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="mini-map-fig" id="miniMapFig">点击人物查看区域</div>
  </div>
</div>
<div class="tooltip" id="tooltip"></div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card" id="modalCard"></div>
</div>
<div class="compare-overlay" id="compareOverlay">
  <div class="compare-card" id="compareCard"></div>
</div>

<script>
(function() {
  // ═══════════════════════════════════════════════════════════════
  // PORTRAIT SVG GENERATORS — AI-styled traditional Chinese portraits
  // ═══════════════════════════════════════════════════════════════
  // ═══════════════════════════════════════════════════════════════
  // PORTRAIT CANVAS SYSTEM — ancient Chinese manga style (古风漫画)
  // ═══════════════════════════════════════════════════════════════
  const PW = 240, PH = 320;

  function drawMangaEye(ctx, cx, cy, w, h, irisColor) {
    ctx.save();
    // Eye white
    ctx.beginPath();
    ctx.ellipse(cx, cy, w/2, h/2, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#fefefe';
    ctx.fill();
    ctx.strokeStyle = 'rgba(40,20,10,0.12)';
    ctx.lineWidth = 0.6;
    ctx.stroke();
    // Upper shadow gradient
    const sg = ctx.createLinearGradient(cx, cy-h/2, cx, cy+h/2);
    sg.addColorStop(0, 'rgba(0,0,0,0.10)');
    sg.addColorStop(0.5, 'rgba(0,0,0,0)');
    sg.addColorStop(1, 'rgba(0,0,0,0.03)');
    ctx.beginPath();
    ctx.ellipse(cx, cy, w/2, h/2, 0, 0, Math.PI * 2);
    ctx.fillStyle = sg;
    ctx.fill();
    // Iris
    const ig = ctx.createRadialGradient(cx-w*0.08, cy-h*0.10, w*0.04, cx, cy, w*0.32);
    ig.addColorStop(0, irisColor);
    ig.addColorStop(0.7, '#120600');
    ig.addColorStop(1, '#060200');
    ctx.beginPath();
    ctx.ellipse(cx, cy+0.5, w*0.36, h*0.42, 0, 0, Math.PI * 2);
    ctx.fillStyle = ig;
    ctx.fill();
    // Pupil
    ctx.beginPath();
    ctx.ellipse(cx, cy+0.5, w*0.17, h*0.26, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#030100';
    ctx.fill();
    // Main catchlight (large, upper-left)
    ctx.beginPath();
    ctx.ellipse(cx-w*0.10, cy-h*0.13, w*0.12, h*0.16, -0.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.fill();
    // Secondary catchlight (small, lower-right)
    ctx.beginPath();
    ctx.arc(cx+w*0.06, cy+h*0.06, w*0.05, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.fill();
    // Tiny catchlight
    ctx.beginPath();
    ctx.arc(cx-w*0.14, cy-h*0.18, w*0.025, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fill();
    // Upper lash line (thick, characteristic manga line)
    ctx.beginPath();
    ctx.moveTo(cx-w/2-1.5, cy-0.5);
    ctx.quadraticCurveTo(cx-w*0.05, cy-h/2-3, cx+w/2+1.5, cy-0.5);
    ctx.strokeStyle = '#140804';
    ctx.lineWidth = 2.6;
    ctx.lineCap = 'round';
    ctx.stroke();
    // Outer corner wing
    ctx.beginPath();
    ctx.moveTo(cx+w/2-1, cy-0.5);
    ctx.quadraticCurveTo(cx+w/2+2.5, cy-2, cx+w/2+4.5, cy+1.5);
    ctx.strokeStyle = '#140804';
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    ctx.stroke();
    // Lower lash line (subtle)
    ctx.beginPath();
    ctx.moveTo(cx-w/2+1, cy+2);
    ctx.quadraticCurveTo(cx, cy+h/2-0.5, cx+w/2-1, cy+2);
    ctx.strokeStyle = 'rgba(30,10,5,0.30)';
    ctx.lineWidth = 0.7;
    ctx.stroke();
    // Eyelid crease
    ctx.beginPath();
    ctx.moveTo(cx-w/2-1, cy-h/2-1);
    ctx.quadraticCurveTo(cx, cy-h/2-8, cx+w/2+1, cy-h/2-1);
    ctx.strokeStyle = 'rgba(30,10,5,0.10)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
    ctx.restore();
  }

  function drawMangaFace(ctx, cx, cy, opts) {
    const { irises, brows, nose, mouth, blush } = opts;
    ctx.save();
    // Face shadow
    ctx.beginPath();
    ctx.ellipse(cx+1, cy+1, 35, 41, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    ctx.fill();
    // Face base with warm skin gradient
    const skinGrad = ctx.createRadialGradient(cx-2, cy-12, 5, cx, cy+10, 42);
    skinGrad.addColorStop(0, '#fef7ed');
    skinGrad.addColorStop(0.45, '#f2e0c2');
    skinGrad.addColorStop(0.8, '#e6cca2');
    skinGrad.addColorStop(1, '#c8a878');
    ctx.beginPath();
    ctx.ellipse(cx, cy, 35, 41, 0, 0, Math.PI * 2);
    ctx.fillStyle = skinGrad;
    ctx.fill();
    // Face outline
    ctx.strokeStyle = '#b89468';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    // Blush
    blush.forEach(b => {
      const bg = ctx.createRadialGradient(b.x, b.y, 2, b.x, b.y, b.r);
      bg.addColorStop(0, 'rgba(255,175,165,0.42)');
      bg.addColorStop(0.6, 'rgba(255,155,145,0.18)');
      bg.addColorStop(1, 'rgba(255,145,135,0)');
      ctx.beginPath();
      ctx.ellipse(b.x, b.y, b.r, b.r*0.6, 0, 0, Math.PI * 2);
      ctx.fillStyle = bg;
      ctx.fill();
    });
    // Eyes
    irises.forEach(eye => { drawMangaEye(ctx, eye.x, eye.y, eye.w, eye.h, eye.color); });
    // Eyebrows
    brows.forEach(b => {
      ctx.beginPath();
      ctx.moveTo(b.x1, b.y1);
      ctx.quadraticCurveTo(b.xc, b.yc, b.x2, b.y2);
      ctx.strokeStyle = b.color || '#1a0a04';
      ctx.lineWidth = b.width || 2;
      ctx.lineCap = 'round';
      ctx.stroke();
    });
    // Nose
    if (nose) {
      ctx.beginPath();
      ctx.moveTo(nose.x, nose.y-3);
      ctx.quadraticCurveTo(nose.x+1, nose.y, nose.x-1, nose.y+1);
      ctx.strokeStyle = '#c4a078';
      ctx.lineWidth = 0.8;
      ctx.lineCap = 'round';
      ctx.stroke();
      // Nostril shadows
      ctx.beginPath();
      ctx.ellipse(nose.x-3, nose.y+2.5, 1.8, 1.2, 0.1, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(160,120,80,0.13)';
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(nose.x+3, nose.y+2.5, 1.8, 1.2, -0.1, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(160,120,80,0.13)';
      ctx.fill();
    }
    // Nose bridge highlight
    ctx.beginPath();
    ctx.moveTo(cx, cy-15);
    ctx.quadraticCurveTo(cx-1, cy-5, cx, cy+1);
    ctx.strokeStyle = 'rgba(255,250,240,0.18)';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.stroke();
    // Mouth
    if (mouth) {
      ctx.beginPath();
      ctx.moveTo(mouth.x1, mouth.my);
      ctx.quadraticCurveTo((mouth.x1+mouth.x2)/2, mouth.my+mouth.arc, mouth.x2, mouth.my);
      ctx.strokeStyle = '#b08060';
      ctx.lineWidth = 1.3;
      ctx.lineCap = 'round';
      ctx.stroke();
      // Lower lip highlight
      ctx.beginPath();
      ctx.moveTo(mouth.x1+2, mouth.my+0.5);
      ctx.quadraticCurveTo((mouth.x1+mouth.x2)/2, mouth.my+mouth.arc+1.5, mouth.x2-2, mouth.my+0.5);
      ctx.strokeStyle = 'rgba(180,120,80,0.25)';
      ctx.lineWidth = 0.7;
      ctx.lineCap = 'round';
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawMangaHair(ctx, cx, cy, hairColor, style) {
    ctx.save();
    // Back hair mass
    ctx.beginPath();
    ctx.ellipse(cx, cy-4, 38, 48, 0, 0, Math.PI * 2);
    const hg = ctx.createLinearGradient(cx, cy-50, cx, cy+40);
    hg.addColorStop(0, '#0a0603');
    hg.addColorStop(0.5, hairColor || '#180e06');
    hg.addColorStop(1, '#0a0402');
    ctx.fillStyle = hg;
    ctx.fill();
    // Front hair shape
    ctx.beginPath();
    ctx.moveTo(cx-37, cy-5);
    ctx.quadraticCurveTo(cx-38, cy-20, cx-20, cy-43);
    ctx.quadraticCurveTo(cx, cy-47, cx+20, cy-43);
    ctx.quadraticCurveTo(cx+38, cy-20, cx+37, cy-5);
    ctx.quadraticCurveTo(cx+36, cy+10, cx+28, cy+20);

  function renderPortrait(canvas, figure) {
    canvas.width = PW;
    canvas.height = PH;
    const ctx = canvas.getContext('2d');
    const color = figure.group.color;
    const type = figure.portraitType;

    // Background
    const bg = ctx.createRadialGradient(120, 100, 20, 120, 160, 200);
    bg.addColorStop(0, '#1e1a28'); bg.addColorStop(1, '#0a0812');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, PW, PH);

    // Subtle aura
    ctx.beginPath();
    ctx.ellipse(120, 86, 50, 60, 0, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.035;
    ctx.fill();
    ctx.globalAlpha = 1;

    const faceCx = 120, faceCy = 86;
    const faceOpts = {
      irises: [
        { x: 96, y: 80, w: 21, h: 13.5, color: type === 'general' ? '#1a0800' : '#3a1a08' },
        { x: 144, y: 80, w: 21, h: 13.5, color: type === 'general' ? '#1a0800' : '#3a1a08' }
      ],
      brows: type === 'general' ? [
        { x1: 82, y1: 65, xc: 96, yc: 59, x2: 110, y2: 67, width: 2.6, color: '#1a0602' },
        { x1: 130, y1: 67, xc: 144, yc: 59, x2: 158, y2: 65, width: 2.6, color: '#1a0602' }
      ] : type === 'ruler' ? [
        { x1: 83, y1: 66, xc: 96, yc: 61, x2: 109, y2: 66, width: 2.2, color: '#1a0804' },
        { x1: 131, y1: 66, xc: 144, yc: 61, x2: 157, y2: 66, width: 2.2, color: '#1a0804' }
      ] : [
        { x1: 85, y1: 66, xc: 96, yc: 62, x2: 107, y2: 65, width: 1.6, color: '#2a1006' },
        { x1: 133, y1: 65, xc: 144, yc: 62, x2: 155, y2: 66, width: 1.6, color: '#2a1006' }
      ],
      nose: { x: 120, y: 94 },
      mouth: type === 'general' ? { x1: 110, x2: 130, my: 105, arc: 1.5 } :
              type === 'ruler' ? { x1: 111, x2: 129, my: 104, arc: 1 } :
              { x1: 112, x2: 128, my: 103, arc: -1 },
      blush: [{ x: 76, y: 88, r: 13 }, { x: 164, y: 88, r: 13 }]
    };

    // Draw layers: hair back → costume → face → beard → hair front detail
    drawMangaHair(ctx, faceCx, faceCy, '#140c06', 'full');

    if (type === 'ruler') drawRulerCostume(ctx, color);
    else if (type === 'general') drawGeneralCostume(ctx, color);
    else drawScholarCostume(ctx, color);

    drawMangaFace(ctx, faceCx, faceCy, faceOpts);

    // Beard
    if (type === 'ruler' || type === 'general') {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(104, 106);
      ctx.quadraticCurveTo(108, type === 'ruler' ? 148 : 132, 120, type === 'ruler' ? 158 : 138);
      ctx.quadraticCurveTo(132, type === 'ruler' ? 148 : 132, 136, 106);
      ctx.quadraticCurveTo(128, 112, 120, 113);
      ctx.quadraticCurveTo(112, 112, 104, 106);
      ctx.closePath();
      const beardGrad = ctx.createLinearGradient(120, 106, 120, type === 'ruler' ? 158 : 138);
      beardGrad.addColorStop(0, '#1a0c04'); beardGrad.addColorStop(1, '#0a0402');
      ctx.fillStyle = beardGrad; ctx.fill();
      for (let i = -3; i <= 3; i++) {
        ctx.beginPath();
        ctx.moveTo(120 + i*6, 108);
        ctx.quadraticCurveTo(120 + i*4, type === 'ruler' ? 138 : 124, 120 + i*2, type === 'ruler' ? 154 : 134);
        ctx.strokeStyle = 'rgba(0,0,0,0.22)';
        ctx.lineWidth = 0.6;
        ctx.stroke();
      }
      // Mustache
      ctx.beginPath();
      ctx.moveTo(108, 103); ctx.quadraticCurveTo(114, 107, 120, 103); ctx.quadraticCurveTo(114, 105, 108, 103);
      ctx.fillStyle = '#1a0c04'; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(132, 103); ctx.quadraticCurveTo(126, 107, 120, 103); ctx.quadraticCurveTo(126, 105, 132, 103);
      ctx.fillStyle = '#1a0c04'; ctx.fill();
      ctx.restore();
    }

    if (type === 'scholar') {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(112, 106); ctx.quadraticCurveTo(114, 118, 116, 122);
      ctx.quadraticCurveTo(118, 125, 120, 126); ctx.quadraticCurveTo(122, 125, 124, 122);
      ctx.quadraticCurveTo(126, 118, 128, 106); ctx.closePath();
      ctx.fillStyle = 'rgba(20,8,2,0.22)'; ctx.fill();
      ctx.restore();
    }

    // Watermark
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.font = '9px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('古风漫画', 120, 315);
  }

  function getPortrait(f) {
    const imgUrl = imageMap[f.name];
    const canvas = document.createElement('canvas');
    renderPortrait(canvas, f);
    const fallback = canvas.toDataURL();
    if (!imgUrl) {
      return `<img src="${fallback}" width="120" height="160" style="border-radius:8px;display:block" alt="${f.name}">`;
    }
    return `<div style="position:relative;width:120px;height:160px;border-radius:8px;overflow:hidden">
      <img src="${fallback}" width="120" height="160" style="display:block;position:absolute;inset:0" alt="">
      <img src="${imgUrl}" onerror="this.remove()" onload="this.previousElementSibling.remove()" width="120" height="160" style="display:block;position:absolute;inset:0;object-fit:cover" alt="${f.name}">
    </div>`;
  }

          bio: "东汉末年杰出的政治家、军事家、文学家，曹魏政权的奠基人。挟天子以令诸侯，先后消灭吕布、袁术、袁绍等割据势力，统一中国北方。用兵如神，知人善任，在文学上与曹丕、曹植并称「三曹」，开创建安文学新风。毛泽东评价其为「了不起的政治家、军事家，也是个了不起的诗人」。",
          events: [[184,"任骑都尉，参与镇压黄巾起义"],[190,"与袁绍等诸侯组成讨董联军"],[192,"收编青州黄巾军三十万，实力大增"],[196,"迎汉献帝至许昌，开始「挟天子以令诸侯」"],[200,"官渡之战以少胜多，大败袁绍"],[207,"北征乌桓，彻底统一北方"],[208,"赤壁之战败于孙刘联军，三国鼎立之势形成"],[213,"受封魏公，建立魏国社稷"],[216,"进爵魏王，冕十二旒，驾六马"]] },
        { name: "荀彧", birth: 163, death: 212, role: "王佐之才·尚书令", portraitType: "scholar",
          bio: "曹操帐下第一谋士，被曹操誉为「吾之子房」。为曹操制定「深根固本以制天下」的战略方针，在官渡之战中力劝曹操坚守不退，终获全胜。为曹操举荐了荀攸、郭嘉、陈群、司马懿等大量人才，奠定了曹魏的人才基础。",
          events: [[191,"离开袁绍，投奔曹操"],[194,"坚守鄄城，为曹操保住根本之地"],[196,"建议迎奉天子都许，取得政治优势"],[200,"官渡之战中坚定曹操作战决心"],[204,"反对恢复九州制，维护曹操集权"],[212,"反对曹操称魏公，被疏远，忧郁而终"]] },
        { name: "郭嘉", birth: 170, death: 207, role: "军师祭酒·鬼才", portraitType: "scholar",
          bio: "曹操早期最重要的谋士之一，以「深谋远虑、算无遗策」著称。在官渡决战前提出著名的「十胜十败」论，极大鼓舞了曹军士气。善于洞察人心，对孙策、袁绍等人的结局均有神准预判。惜英年早逝，曹操在赤壁战后痛哭「若奉孝在，不使孤至此」。",
          events: [[196,"经荀彧推荐，与曹操论天下事，被赞「使孤成大业者，必此人也」"],[198,"献计水攻下邳，擒杀吕布"],[200,"提出「十胜十败」论，坚定官渡决战信心"],[203,"建言缓攻，使袁绍二子自相残杀"],[207,"力劝曹操远征乌桓，病逝于行军途中"]] },
        { name: "司马懿", birth: 179, death: 251, role: "太傅·晋朝奠基人", portraitType: "general",
          bio: "三国时期魏国杰出的政治家、军事家。曹操时代韬光养晦，曹丕、曹叡时期逐渐掌握兵权。用兵灵活多变，曾千里奔袭擒斩孟达，百日平定辽东公孙渊。与诸葛亮在五丈原相持百日，最终拖死对手。晚年发动高平陵政变，诛杀曹爽，彻底掌控魏国大权，为西晋代魏奠定基础。",
          events: [[208,"曹操征辟，装病推辞后被迫出仕"],[219,"建议曹操联合东吴，解樊城关羽之围"],[228,"八日奔袭上庸，擒斩孟达"],[231,"开始与诸葛亮的数次陇西对峙"],[234,"五丈原与诸葛亮相持百日"],[238,"率军四万征辽东，屠公孙渊"],[239,"受魏明帝遗诏，与曹爽共同辅政"],[249,"发动高平陵之变，诛曹爽三族，独揽大权"]] },
        { name: "曹丕", birth: 187, death: 226, role: "魏文帝·代汉开国", portraitType: "ruler",
          bio: "曹操次子，曹魏开国皇帝。220年接受汉献帝禅让，正式建立魏国，完成由汉至魏的政权更替。在位期间推行九品中正制，对后世选官制度影响深远。在文学上造诣极高，所著《典论·论文》是中国文学批评史上的开山之作。",
          events: [[204,"攻破邺城，纳甄氏为妻"],[211,"任五官中郎将，开始参与军政"],[217,"被立为魏王世子"],[220,"接受汉献帝禅让，登基称帝，改元黄初"],[221,"推行九品中正制"],[222,"三路大军伐吴，惨败而归"],[224,"著《典论》，开文学批评先河"]] },
        { name: "曹植", birth: 192, death: 232, role: "陈思王·才高八斗", portraitType: "scholar",
          bio: "曹操第三子，建安文学最杰出的代表。谢灵运曾言「天下才有一石，曹子建独占八斗」。其《洛神赋》被誉为千古绝唱，《白马篇》《七哀诗》等标志着文人五言诗的巅峰。与曹丕争嗣失败后饱受猜忌，后半生郁郁不得志，但其文学成就照耀千古。",
          events: [[210,"铜雀台建成，即席作《登台赋》，曹操大悦"],[214,"随曹操南征孙权，留守邺城"],[217,"酒后擅开司马门，失去曹操信任"],[220,"曹丕称帝，七步成诗「本是同根生，相煎何太急」"],[221,"贬爵安乡侯，此后屡遭迁徙"],[223,"作《洛神赋》，文采斐然"]] },
        { name: "邓艾", birth: 197, death: 264, role: "征西将军·灭蜀第一功", portraitType: "general",
          bio: "三国时期魏国后期最杰出的将领之一。出身贫寒，因屯田有功逐渐崭露头角。长年与姜维在陇西周旋。263年率偏师偷渡阴平小道，翻越无人之境七百余里，直取成都，迫使蜀汉后主刘禅投降，创造了中国战争史上最辉煌的奇袭战例。",
          events: [[240,"任典农中郎将，在淮南屯田积谷"],[249,"出任安西将军，开始在雍凉对抗姜维"],[256,"段谷之战大破姜维"],[263,"与钟会分兵伐蜀，偷渡阴平"],[263,"破江由、绵竹，兵临成都，刘禅出降"],[264,"遭钟会诬陷谋反，被收押，后遇害于途中"]] },,
        { name: "夏侯惇", birth: 157, death: 220, role: "大将军·独目元让", portraitType: "general",
          bio: "曹操麾下最信任的宗族大将。征吕布时为流矢射中左目，拔箭啖睛，继续冲锋陷阵。常年镇守后方，督运军粮，为曹操稳固大本营。为人清俭，有余财则分施部下。",
          events: [[190,"随曹操起兵讨董卓"],[194,"征吕布，被流矢射中左目"],[200,"官渡之战中督守后方"],[207,"北征乌桓有功"],[216,"拜大将军"],[219,"督二十六军屯居巢"]] },
        { name: "张辽", birth: 169, death: 222, role: "前将军·威震逍遥津", portraitType: "general",
          bio: "曹魏「五子良将」之首。原为吕布部将，归顺曹操后屡建奇功。215年合肥之战，率八百精骑突袭孙权十万大军，差点活捉孙权，从此「张辽止啼」成为江东小儿不敢夜哭的典故。",
          events: [[198,"吕布败亡，率众降曹操"],[200,"官渡之战中与关羽共破颜良"],[207,"白狼山之战斩杀蹋顿单于"],[215,"逍遥津之战，八百破十万"],[220,"拜前将军"],[222,"病逝于江都"]] },
        { name: "贾诩", birth: 147, death: 223, role: "太尉·算无遗策", portraitType: "scholar",
          bio: "三国时期最精于自保的谋士。早年仕于董卓、李傕、张绣，每献一计必中要害。劝说张绣降曹后，成为曹操重要谋臣。在立嗣问题上以袁绍、刘表为例暗示曹操立曹丕，奠定曹魏国本。",
          events: [[189,"董卓入京，被辟为掾属"],[192,"李傕反攻长安，贾诩献计成功"],[197,"为张绣设谋，宛城之战大败曹操"],[199,"劝说张绣降曹"],[217,"暗示曹操立曹丕为世子"],[220,"曹丕拜为太尉"]] }
      ]
    },
    {
      name: "蜀汉", color: "#5cb860",
      figures: [
        { name: "关羽", birth: 160, death: 220, role: "前将军·汉寿亭侯", portraitType: "general",

        { name: "刘备", birth: 161, death: 223, role: "昭烈帝·蜀汉开国", portraitType: "ruler",
          bio: "蜀汉开国皇帝。虽出身织席贩履，但以仁德服人，百折不挠。三顾茅庐请诸葛亮出山，联吴抗曹取得赤壁之胜。先后占据荆州、益州，于221年在成都称帝。为报关羽之仇发动夷陵之战，惨败后病逝白帝城，临终托孤于诸葛亮，成千古君臣典范。",

        { name: "赵云", birth: 168, death: 229, role: "镇军将军·一身是胆", portraitType: "general",

        { name: "诸葛亮", birth: 181, death: 234, role: "丞相·千古名相", portraitType: "scholar",
          bio: "中国历史上最著名的政治家、军事家、发明家之一。隐居隆中时即提出「三分天下」的《隆中对》。受刘备三顾之请出山，联吴抗曹，辅佐刘备建立蜀汉。刘禅即位后鞠躬尽瘁，五次北伐中原，最终积劳成疾病逝于五丈原军中。其木牛流马、诸葛连弩等发明影响深远，《出师表》为千古名篇。",
          events: [[207,"刘备三顾茅庐，隆中对定三分之策"],[208,"出使东吴，促成孙刘联盟"],[214,"坐镇成都，足食足兵保障前线"],[221,"刘备病逝后受遗诏辅政"],[225,"南征孟获，七擒七纵平定南中"],[227,"上《出师表》，开始第一次北伐"],[228,"街亭之败，挥泪斩马谡"],[231,"发明木牛流马运粮"],[234,"第五次北伐，与司马懿对峙五丈原，病逝军中"]] },
        { name: "姜维", birth: 202, death: 264, role: "大将军·九伐中原", portraitType: "general",
          bio: "蜀汉后期的擎天之柱。原为魏将，被诸葛亮收服后视为衣钵传人。诸葛亮死后继承北伐大业，先后九次出兵中原，胜多败少。蜀汉灭亡后，策反钟会企图复国，事败被杀。",
          events: [[228,"诸葛亮第一次北伐时归降蜀汉"],[234,"诸葛亮病逝，开始承担军事重任"],[247,"第一次独立北伐"],[256,"段谷之战"],[262,"第九次北伐"],[263,"邓艾偷渡阴平灭蜀，姜维率军降钟会"],[264,"策反钟会，图谋复国，事败身死"]] },,
        { name: "庞统", birth: 179, death: 214, role: "军师中郎将·凤雏", portraitType: "scholar",
          bio: "与诸葛亮并称「卧龙凤雏」的奇才。经鲁肃、诸葛亮推荐为刘备所用。献「上中下三计」助刘备入蜀，取中计斩杀杨怀、高沛。在雒城之战中中流矢身亡，年仅三十六岁。",

        { name: "马超", birth: 176, death: 222, role: "骠骑将军·锦马超", portraitType: "general",

  // Flatten

  // ═══════════════════════════════════════════════════════════════
  // CONFIG
  // ═══════════════════════════════════════════════════════════════
  const YEAR_MIN = 150, YEAR_MAX = 620;
  const PX_PER_YEAR = 3.3;
  const CHART_START_X = 175;
  const ROW_HEIGHT = 26;
  const GROUP_HEADER_HEIGHT = 30;
  const TOP_HEADER_HEIGHT = 90;
  const CHART_WIDTH = (YEAR_MAX - YEAR_MIN) * PX_PER_YEAR;
  const SVG_WIDTH = CHART_START_X + CHART_WIDTH + 40;

  let yPositions = [];
  let currentY = TOP_HEADER_HEIGHT;
  groups.forEach(g => {
    currentY += GROUP_HEADER_HEIGHT;
    g.headerY = currentY - GROUP_HEADER_HEIGHT;
    g.figures.forEach(() => { yPositions.push(currentY); currentY += ROW_HEIGHT; });
  });
  const SVG_HEIGHT = currentY + 10;

  // ═══════════════════════════════════════════════════════════════
  // BUILD SVG CHART
  // ═══════════════════════════════════════════════════════════════
  const svg = document.getElementById('chart');
  svg.setAttribute('width', SVG_WIDTH);
  svg.setAttribute('height', SVG_HEIGHT);

  function el(tag, attrs) {
    const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (let [k, v] of Object.entries(attrs)) {
      if (k === 'textContent') e.textContent = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
      else e.setAttribute(k, v);
    }
    return e;
  }

  svg.appendChild(el('rect', { x: 0, y: 0, width: SVG_WIDTH, height: SVG_HEIGHT, fill: 'rgba(18,18,31,0.65)' }));

  // Era bands
  [{ label: '东汉末', start: 184, end: 220, color: '#888' },
   { label: '三国', start: 220, end: 280, color: '#4a90d9' },
   { label: '西晋', start: 265, end: 316, color: '#ab47bc' },
   { label: '东晋十六国', start: 317, end: 420, color: '#26a69a' },
   { label: '南北朝', start: 420, end: 589, color: '#ef5350' },
   { label: '隋', start: 581, end: 618, color: '#f9a825' }].forEach(era => {
    const x = CHART_START_X + (era.start - YEAR_MIN) * PX_PER_YEAR;
    const w = (era.end - era.start) * PX_PER_YEAR;
    svg.appendChild(el('rect', { x, y: 0, width: w, height: TOP_HEADER_HEIGHT - 10, fill: era.color, class: 'era-band' }));
    if (w > 40) svg.appendChild(el('text', { x: x + w / 2, y: TOP_HEADER_HEIGHT - 22, 'text-anchor': 'middle', class: 'era-label-text', textContent: era.label }));
  });

  // Year axis
  for (let year = 150; year <= 610; year += 10) {
    const x = CHART_START_X + (year - YEAR_MIN) * PX_PER_YEAR;
    const isMajor = year % 50 === 0, tickH = isMajor ? 14 : 7;
    svg.appendChild(el('line', { x1: x, y1: TOP_HEADER_HEIGHT - 10 - tickH, x2: x, y2: TOP_HEADER_HEIGHT - 10, stroke: isMajor ? '#666' : '#333', 'stroke-width': isMajor ? 1 : 0.5 }));
    if (isMajor) svg.appendChild(el('text', { x, y: TOP_HEADER_HEIGHT - 10 - tickH - 5, 'text-anchor': 'middle', fill: '#777', 'font-size': 11, textContent: year + '年' }));
  }

  // Gridlines
  for (let year = 200; year <= 600; year += 50) {
    const x = CHART_START_X + (year - YEAR_MIN) * PX_PER_YEAR;
    svg.appendChild(el('line', { x1: x, y1: TOP_HEADER_HEIGHT, x2: x, y2: SVG_HEIGHT, stroke: '#1e1e35', 'stroke-width': 0.5 }));
  }

  // Key events
  [{ year: 208, label: '赤壁之战', color: '#e65140' },{ year: 220, label: '曹丕称帝', color: '#4a90d9' },{ year: 263, label: '魏灭蜀', color: '#4a90d9' },{ year: 280, label: '晋统一', color: '#ab47bc' },{ year: 316, label: '西晋亡', color: '#ab47bc' },{ year: 383, label: '淝水之战', color: '#ff8f00' },{ year: 420, label: '刘裕建宋', color: '#ef5350' },{ year: 439, label: '北魏统一北方', color: '#5c6bc0' },{ year: 534, label: '北魏分裂', color: '#5c6bc0' },{ year: 589, label: '隋统一', color: '#f9a825' }].forEach(ev => {
    const x = CHART_START_X + (ev.year - YEAR_MIN) * PX_PER_YEAR;
    svg.appendChild(el('line', { x1: x, y1: TOP_HEADER_HEIGHT, x2: x, y2: SVG_HEIGHT, stroke: ev.color, 'stroke-width': 0.7, 'stroke-dasharray': '4,4', class: 'event-line' }));
    svg.appendChild(el('text', { x: x - 2, y: TOP_HEADER_HEIGHT + 10, transform: `rotate(-65, ${x - 2}, ${TOP_HEADER_HEIGHT + 10})`, 'text-anchor': 'end', fill: ev.color, 'font-size': 9, class: 'event-label', textContent: ev.label }));
  });

  // Group headers + row bg
  groups.forEach(g => {
    const hy = g.headerY;
    svg.appendChild(el('rect', { x: CHART_START_X, y: hy + 2, width: CHART_WIDTH + 30, height: GROUP_HEADER_HEIGHT - 4, fill: 'none', stroke: g.color, 'stroke-width': 1, 'stroke-dasharray': '6,3', rx: 4, opacity: 0.4 }));
    svg.appendChild(el('text', { x: 10, y: hy + GROUP_HEADER_HEIGHT - 9, fill: g.color, 'font-size': 12, 'font-weight': 'bold', textContent: g.name }));
    g.figures.forEach((f, i) => {
      const y = yPositions[allFigures.indexOf(f)];
      if (i % 2 === 0) svg.appendChild(el('rect', { x: CHART_START_X, y, width: CHART_WIDTH + 30, height: ROW_HEIGHT, fill: '#ffffff04' }));
    });
  });

  // Name labels
  allFigures.forEach((f, idx) => {
    svg.appendChild(el('text', { x: CHART_START_X - 8, y: yPositions[idx] + ROW_HEIGHT / 2 + 4, 'text-anchor': 'end', fill: f.group.color, 'font-size': 13, 'font-weight': '600', textContent: f.name }));
  });

  // Life span bars
  const barRects = [];
  allFigures.forEach((f, idx) => {
    const y = yPositions[idx];
    const barX = CHART_START_X + (f.birth - YEAR_MIN) * PX_PER_YEAR;
    const barW = Math.max(3, (f.death - f.birth) * PX_PER_YEAR);
    const barH = ROW_HEIGHT - 8, barY = y + 4;
    svg.appendChild(el('rect', { x: barX, y, width: barW, height: ROW_HEIGHT, fill: f.group.color, opacity: 0.08 }));
    const rect = el('rect', { x: barX, y: barY, width: barW, height: barH, rx: 3, ry: 3, fill: f.group.color, class: 'bar-rect' });
    rect._data = f;
    barRects.push(rect);
    svg.appendChild(rect);
    if (barW > 30) svg.appendChild(el('text', { x: barX + barW - 4, y: barY + barH - 5, 'text-anchor': 'end', fill: '#aaa', 'font-size': 9, textContent: f.death }));
    if (barW > 40) svg.appendChild(el('text', { x: barX + 4, y: barY + 12, 'text-anchor': 'start', fill: '#999', 'font-size': 9, textContent: f.birth }));
  });

  // ═══════════════════════════════════════════════════════════════
  // TOOLTIP
  // ═══════════════════════════════════════════════════════════════
  const tooltip = document.getElementById('tooltip');
  function showTooltip(f, ev) {
    tooltip.innerHTML = `<div class="tname">${f.name} <span class="tyears">${f.birth} — ${f.death}（享年${f.death - f.birth}岁）</span></div><div class="tdetail">${f.role}</div><div class="tdetail" style="color:${f.group.color};margin-top:3px;">${f.group.name} · 点击查看生平</div>`;
    tooltip.classList.add('show'); moveTooltip(ev);
  }
  function moveTooltip(ev) {
    let tx = ev.clientX + 16, ty = ev.clientY - 10;
    if (tx + 280 > window.innerWidth) tx = ev.clientX - 290;
    if (ty + 90 > window.innerHeight) ty = ev.clientY - 100;
    tooltip.style.left = tx + 'px'; tooltip.style.top = ty + 'px';
  }
  function hideTooltip() { tooltip.classList.remove('show'); }

  // ═══════════════════════════════════════════════════════════════
  // MODAL — click to show portrait + bio + events
  // ═══════════════════════════════════════════════════════════════
  const overlay = document.getElementById('modalOverlay');
  const card = document.getElementById('modalCard');

  function openModal(f) {
    const eventsHtml = f.events.map(([yr, txt]) =>
      `<div class="event-item"><span class="event-year">公元 ${yr} 年</span><span class="event-text">${txt}</span></div>`
    ).join('');

    card.innerHTML = `
      <button class="modal-close" onclick="document.getElementById('modalOverlay').classList.remove('active')">&times;</button>
      <div class="modal-header">
        <div class="portrait-frame">${getPortrait(f)}</div>
        <div class="modal-title-area">
          <div class="modal-name" style="color:${f.group.color}">${f.name}</div>
          <div class="modal-years">公元 ${f.birth} 年 — ${f.death} 年（享年 ${f.death - f.birth} 岁）</div>
          <div class="modal-role">${f.role}</div>
          <div class="modal-era-badge" style="background:${f.group.color}22;color:${f.group.color};border:1px solid ${f.group.color}44">${f.group.name}</div>
        </div>
      </div>
      <div class="modal-bio">${f.bio}</div>
      <div class="modal-events">
        <h3 style="color:${f.group.color}">主要生平事迹</h3>
        <div class="event-timeline">${eventsHtml}</div>
      </div>
    `;
    card.scrollTop = 0;
    overlay.classList.add('active');
  }

  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) overlay.classList.remove('active');
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') overlay.classList.remove('active');
  });

  // ═══════════════════════════════════════════════════════════════
  // EVENT BINDINGS — with comparison mode support
  // ═══════════════════════════════════════════════════════════════
  let selectedFigure = null;

  barRects.forEach(rect => {
    rect.addEventListener('mouseenter', (ev) => { showTooltip(rect._data, ev); });
    rect.addEventListener('mousemove', moveTooltip);
    rect.addEventListener('mouseleave', hideTooltip);
    rect.addEventListener('click', () => {
      const f = rect._data;
      if (selectedFigure && selectedFigure !== f) {
        openCompare(selectedFigure, f);
        barRects.forEach(r => r.classList.remove('selected'));
        highlightRegions(null);
        selectedFigure = null;
      } else if (selectedFigure === f) {
        barRects.forEach(r => r.classList.remove('selected'));
        highlightRegions(null);
        selectedFigure = null;
      } else {
        barRects.forEach(r => r.classList.remove('selected'));
        rect.classList.add('selected');
        selectedFigure = f;
        highlightRegions(f);
        openModal(f);
      }
    });
  });

  // Clear selection hint
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      if (document.getElementById('compareOverlay').classList.contains('active')) {
        document.getElementById('compareOverlay').classList.remove('active');
      } else if (overlay.classList.contains('active')) {
        overlay.classList.remove('active');
      }
      barRects.forEach(r => r.classList.remove('selected'));
      selectedFigure = null;
      highlightRegions(null);
    }

  // SEARCH & FILTER

  const searchInput = document.getElementById('searchInput');
  const filterTags = document.getElementById('filterTags');
  const activeGroups = new Set(groups.map(g => g.name));

  // Build filter tags
  groups.forEach(g => {
    const tag = document.createElement('span');
    tag.className = 'filter-tag';
    tag.textContent = g.name;
    tag.style.background = g.color + '22';
    tag.style.color = g.color;
    tag.style.borderColor = g.color + '44';
    tag.addEventListener('click', () => {
      if (activeGroups.has(g.name)) {
        activeGroups.delete(g.name);
        tag.classList.add('inactive');
      } else {
        activeGroups.add(g.name);
        tag.classList.remove('inactive');
      }
      applyFilter();
    });
    filterTags.appendChild(tag);
  });

  function applyFilter() {
    const query = searchInput.value.trim().toLowerCase();
    // Collect all text labels and row backgrounds
    const allTexts = svg.querySelectorAll('text');
    barRects.forEach(rect => {
      const f = rect._data;
      const visible = (!query || f.name.includes(query)) && activeGroups.has(f.group.name);
      rect.style.opacity = visible ? '1' : '0.12';
      rect.style.pointerEvents = visible ? 'auto' : 'none';
    });
    // Dim/hide name labels + year labels
    allTexts.forEach(t => {
      const content = t.textContent || '';
      // Find matching figure name
      const matchFig = allFigures.find(ff => ff.name === content);
      if (matchFig) {
        const visible = (!query || matchFig.name.includes(query)) && activeGroups.has(matchFig.group.name);
        t.style.opacity = visible ? '1' : '0.15';
      }
    });
  }

  function openCompare(f1, f2) {
    // Highlight combined regions
    const allRegions = [...new Set([...(figureRegions[f1.name]||[]), ...(figureRegions[f2.name]||[])])];
        Object.values(regionEls).forEach(({ group, label }) => {
      const paths = group.querySelectorAll('path');
      paths.forEach(p => {
        p.setAttribute('fill-opacity', '0.15');
        p.setAttribute('stroke-opacity', '0.3');
        p.setAttribute('stroke-width', '0.6');
      });
      group.removeAttribute('filter');
      label.setAttribute('fill', '#777');
      label.setAttribute('font-size', '7');
    });
    allRegions.forEach(rid => {
      const els = regionEls[rid];
      if (els) {
        const paths = els.group.querySelectorAll('path');
        paths.forEach(p => {
          p.setAttribute('fill-opacity', '0.45');
          p.setAttribute('stroke-opacity', '0.85');
          p.setAttribute('stroke-width', '1.5');
          p.setAttribute('stroke', '#f9a825');
        });
        els.group.setAttribute('filter', 'url(#regionGlow)');
        els.label.setAttribute('fill', '#fff');
        els.label.setAttribute('font-size', '8');
      }
    });;
    const regionNames = allRegions.map(rid => {
      const def = regionDefs.find(d => d.id === rid);
      return def ? def.name : rid;
    }).join(' · ');
    miniMapFig.textContent = `${f1.name} vs ${f2.name} · ${regionNames || '未知'}`;
    miniMapFig.style.color = '#f9a825';
    miniMapFig.classList.add('active');

    const overlapStart = Math.max(f1.birth, f2.birth);
    const overlapEnd = Math.min(f1.death, f2.death);
    const hasOverlap = overlapStart <= overlapEnd;

    function colHTML(f) {
      const eventsHtml = f.events.map(([yr, txt]) =>
        `<div class="compare-event-item"><span class="compare-event-year">公元 ${yr} 年</span><span class="compare-event-text">${txt}</span></div>`
      ).join('');
      return `
        <div class="compare-col">
          <div class="compare-col-header">
            <div class="compare-portrait">${getPortrait(f)}</div>
            <div class="cname" style="color:${f.group.color}">${f.name}</div>
            <div class="cyears">公元 ${f.birth} 年 — ${f.death} 年（享年 ${f.death - f.birth} 岁）</div>
            <div class="crole">${f.role}</div>
            <div style="margin-top:4px;font-size:11px;color:${f.group.color};opacity:0.7">${f.group.name}</div>
            ${hasOverlap ? `<div class="overlap-badge">两人交叉 ${overlapStart} — ${overlapEnd} 年（${overlapEnd - overlapStart} 年）</div>` : ''}
          </div>
          <div class="compare-bio">${f.bio}</div>
          <div class="compare-events">
            <h4 style="color:${f.group.color}">主要生平事迹</h4>
            ${eventsHtml}
          </div>
        </div>
      `;
    }

    compareCard.innerHTML = `
      <button class="compare-close" onclick="document.getElementById('compareOverlay').classList.remove('active');highlightRegions(null)">&times;</button>
      <div class="compare-cols">
        ${colHTML(f1)}
        <div class="compare-divider"></div>
        ${colHTML(f2)}
      </div>
      <div class="compare-hint">💡 按 <span>Esc</span> 关闭 · 点击单个色条查看单人详情</div>
    `;
    compareCard.scrollTop = 0;
    compareOverlay.classList.add('active');
  }

  compareOverlay.addEventListener('click', function(e) {
    if (e.target === compareOverlay) {
      compareOverlay.classList.remove('active');

  const miniMapSvg = document.getElementById('miniMap');
  const miniMapFig = document.getElementById('miniMapFig');
  const regionEls = {};

  function buildMiniMap() {
    while (miniMapSvg.firstChild) miniMapSvg.removeChild(miniMapSvg.firstChild);

    const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
    const glow = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
    glow.setAttribute('id', 'regionGlow');
    glow.setAttribute('x', '-25%'); glow.setAttribute('y', '-25%');
    glow.setAttribute('width', '150%'); glow.setAttribute('height', '150%');
    glow.innerHTML = '<feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>';
    defs.appendChild(glow);
    miniMapSvg.appendChild(defs);

    const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bg.setAttribute('x', 0); bg.setAttribute('y', 0);
    bg.setAttribute('width', 300); bg.setAttribute('height', 220);
    bg.setAttribute('fill', '#0a0a18');
    miniMapSvg.appendChild(bg);

    BG_PATHS.forEach(d => {
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', d);
      p.setAttribute('fill', '#121224');
      p.setAttribute('stroke', '#1a1a32');
      p.setAttribute('stroke-width', '0.4');
      p.setAttribute('opacity', '0.5');
      miniMapSvg.appendChild(p);
    });

    regionDefs.forEach(r => {
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('data-region', r.id);
      g.setAttribute('class', 'map-region-group');

      r.paths.forEach(d => {
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', d);
        p.setAttribute('fill', r.color);
        p.setAttribute('fill-opacity', '0.15');
        p.setAttribute('stroke', r.color);
        p.setAttribute('stroke-width', '0.6');
        p.setAttribute('stroke-opacity', '0.3');
        p.setAttribute('class', 'map-region');
        p.setAttribute('data-region', r.id);
        g.appendChild(p);
      });

      const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      label.setAttribute('x', r.labelX);
      label.setAttribute('y', r.labelY + 1);
      label.setAttribute('class', 'map-label');
      label.setAttribute('data-region', r.id);
      label.setAttribute('text-anchor', 'middle');
      label.setAttribute('fill', '#777');
      label.setAttribute('font-size', '7');
      label.textContent = r.name;
      g.appendChild(label);

      miniMapSvg.appendChild(g);
      regionEls[r.id] = { group: g, label };
    });

    [{ name: '洛阳', x: 175, y: 108 }, { name: '长安', x: 122, y: 98 },
     { name: '建康', x: 228, y: 128 }, { name: '成都', x: 90, y: 148 },
     { name: '邺城', x: 194, y: 78 }].forEach(c => {
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', c.x); dot.setAttribute('cy', c.y); dot.setAttribute('r', 2);
      dot.setAttribute('fill', '#fff'); dot.setAttribute('opacity', '0.35');
      miniMapSvg.appendChild(dot);
      const cl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      cl.setAttribute('x', c.x + 4); cl.setAttribute('y', c.y + 3);
      cl.setAttribute('fill', '#444'); cl.setAttribute('font-size', '6.5');
      cl.textContent = c.name;
      miniMapSvg.appendChild(cl);
    });

    const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    arrow.setAttribute('x', 290); arrow.setAttribute('y', 14);
    arrow.setAttribute('text-anchor', 'end'); arrow.setAttribute('fill', '#3a3a3a');
    arrow.setAttribute('font-size', '10');
    arrow.textContent = 'N↑';
    miniMapSvg.appendChild(arrow);
  }
  function highlightRegions(figure) {
    Object.values(regionEls).forEach(({ group, label }) => {
      const paths = group.querySelectorAll('path');
      paths.forEach(p => {
        p.setAttribute('fill-opacity', '0.15');
        p.setAttribute('stroke-opacity', '0.3');
        p.setAttribute('stroke-width', '0.6');
      });
      group.removeAttribute('filter');
      label.setAttribute('fill', '#777');
      label.setAttribute('font-size', '7');
    });

    if (!figure) {
      miniMapFig.textContent = '点击人物查看区域';
      miniMapFig.classList.remove('active');
      return;
    }

    const regions = figureRegions[figure.name] || [];
    regions.forEach(rid => {
      const els = regionEls[rid];
      if (els) {
        const paths = els.group.querySelectorAll('path');
        paths.forEach(p => {
          p.setAttribute('fill-opacity', '0.45');
          p.setAttribute('stroke-opacity', '0.85');
          p.setAttribute('stroke-width', '1.5');
          p.setAttribute('stroke', figure.group.color);
        });
        els.group.setAttribute('filter', 'url(#regionGlow)');
        els.label.setAttribute('fill', '#fff');
        els.label.setAttribute('font-size', '8');
      }
    });

    const regionNames = regions.map(rid => {
      const def = regionDefs.find(d => d.id === rid);
      return def ? def.name : rid;
    }).join(' · ');
    miniMapFig.textContent = figure.name + ' · ' + (regionNames || '未知');
    miniMapFig.style.color = figure.group.color;
    miniMapFig.classList.add('active');
  }
  window.highlightRegions = highlightRegions;
  buildMiniMap();

  // ═══════════════════════════════════════════════════════════════
  // LEGEND — click to scroll to group; ctrl+click to filter
  // ═══════════════════════════════════════════════════════════════
  const legend = document.getElementById('legend');
  const chartWrapper = document.getElementById('chartWrapper');
  let legendTags = [];
  groups.forEach(g => {
    const item = document.createElement('span');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${g.color}"></span>${g.name}`;
    item.addEventListener('click', (e) => {
      if (e.ctrlKey || e.metaKey) {
        // Toggle filter
        if (activeGroups.has(g.name)) {
          activeGroups.delete(g.name);
        } else {
          activeGroups.add(g.name);
        }
        // Sync filter tags
        const tag = filterTags.children[groups.indexOf(g)];
        if (tag) tag.classList.toggle('inactive', !activeGroups.has(g.name));
        applyFilter();
      } else {
        chartWrapper.scrollTo({ top: g.headerY + GROUP_HEADER_HEIGHT, behavior: 'smooth' });
      }
    });
    legend.appendChild(item);
    legendTags.push(item);
  });

  // Initial scroll position
  chartWrapper.scrollLeft = Math.max(0, CHART_START_X + (190 - YEAR_MIN) * PX_PER_YEAR - 200);

  console.log('✅ 魏晋南北朝人物对比图 v3 已就绪');
  console.log(`   ${allFigures.length} 位人物 | Canvas古风漫画画像 | 搜索筛选 | 双人对比模式 | Ctrl+图例筛选`);
})();
</script>
